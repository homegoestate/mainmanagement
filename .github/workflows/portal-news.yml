name: ERP public news and regression checks
on:
  push:
    paths:
      - 'index.html'
      - 'news.html'
      - 'news-reader.mjs'
      - 'portal-news.mjs'
      - 'login-check.html'
      - 'login-check.mjs'
      - 'tools/refresh_news.py'
      - 'tools/integrate_portal.py'
      - 'tools/runtime_preflight.py'
      - 'tests/news.test.mjs'
      - 'tests/news-entry.test.mjs'
      - 'tests/test_refresh_news.py'
      - 'tests/test_portal_patch.py'
      - 'tests/portal-runtime.test.mjs'
      - 'tests/original-full-feature.test.mjs'
      - '.github/workflows/portal-news.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: portal-news-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check login-check.mjs && node --check portal-news.mjs && node --test tests/news.test.mjs tests/news-entry.test.mjs tests/portal-runtime.test.mjs tests/original-full-feature.test.mjs
      - run: python tests/test_refresh_news.py
      - run: python tests/test_portal_patch.py && python tools/integrate_portal.py --check
  refresh:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public read-only availability check
        run: python tools/runtime_preflight.py
      - name: Apply only the exact approved UI and message-origin patch
        run: python tests/test_portal_patch.py && python tools/integrate_portal.py
      - name: Fetch public RSS metadata only
        run: python tools/refresh_news.py
      - name: Commit only the approved portal UI and news snapshot
        run: |
          git config user.name 'HomeGo News Automation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html news/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'portal: verified news UI integration and dated RSS snapshot'
            git push origin HEAD:main
          fi
      - name: Request Pages build after automation commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
