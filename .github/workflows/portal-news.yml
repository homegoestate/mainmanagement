name: ERP public news and regression checks
on:
  push:
    paths:
      - 'index.html'
      - 'news.html'
      - 'news-reader.mjs'
      - 'portal-news.mjs'
      - 'login-check.html'
      - 'login-check.mjs'
      - 'tools/refresh_news.py'
      - 'tools/integrate_portal.py'
      - 'tools/runtime_preflight.py'
      - 'tests/news.test.mjs'
      - 'tests/news-entry.test.mjs'
      - 'tests/test_refresh_news.py'
      - 'tests/test_portal_patch.py'
      - 'tests/portal-runtime.test.mjs'
      - 'tests/session-quota.test.mjs'
      - 'tests/device-identity-idb.test.mjs'
      - 'tests/original-full-feature.test.mjs'
      - '.github/workflows/portal-news.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: portal-news-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check login-check.mjs && node --check portal-news.mjs && node --test tests/news.test.mjs tests/news-entry.test.mjs tests/portal-runtime.test.mjs tests/original-full-feature.test.mjs tests/session-quota.test.mjs tests/device-identity-idb.test.mjs
      - run: python tests/test_refresh_news.py
      - run: python tests/test_portal_patch.py && python tools/integrate_portal.py --check
  # 2026-11-17 Claude（楊總要求修復每日新聞）：新聞更新只依新聞自己的檢查，不再被 11/12 換登入後
  # 尚未更新的舊登入測試（上方 test）擋住；test 仍照常執行並顯示結果。
  news-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check portal-news.mjs && node --check news-reader.mjs && node --test tests/news.test.mjs tests/news-entry.test.mjs
      - run: python tests/test_refresh_news.py
  refresh:
    needs: news-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public read-only availability check
        run: python tools/runtime_preflight.py
      # 新聞介面已整合進首頁（index.html 內有 HG_PUBLIC_NEWS_BRIDGE_20261020），自動化不再修改首頁，只更新新聞快照。
      - name: Fetch public RSS metadata only
        run: python tools/refresh_news.py
      - name: Commit only the news snapshot
        run: |
          git config user.name 'HomeGo News Automation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add news/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'portal: dated RSS snapshot'
            git push origin HEAD:main
          fi
      - name: Request Pages build after automation commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
