<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeGo Estate - 內部管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --text-light: #ecf0f1;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 登入與註冊容器 */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }

        .auth-box h2 { color: var(--primary-color); margin-bottom: 20px; }

        .input-group { margin: 10px 0; text-align: left; }
        .input-group label { font-size: 12px; color: #666; }
        
        .auth-box input[type="text"], 
        .auth-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .checkbox-group {
            text-align: left;
            margin: 10px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .checkbox-group input { margin-right: 5px; }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-warning { background-color: var(--warning-color); color: white; }

        .switch-link {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 警告訊息 */
        .alert-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
            text-align: left;
        }

        /* 儀表板樣式 */
        #dashboard-container { display: none; height: 100vh; display: flex; }

        .sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            background-color: var(--secondary-color);
            font-weight: bold;
            font-size: 1.2em;
        }

        .nav-links { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-links li { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links li a {
            display: block;
            padding: 15px 20px;
            color: var(--text-light);
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-links li a:hover, .nav-links li a.active { background-color: var(--accent-color); }

        .user-info {
            padding: 15px;
            background-color: var(--secondary-color);
            text-align: center;
            font-size: 0.9em;
        }

        .main-content {
            flex-grow: 1;
            background-color: white;
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* 管理員面板 */
        #admin-panel {
            display: none;
            padding: 20px;
            background: white;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .admin-section {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #f9f9f9;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: var(--primary-color); color: white; }
        .status-pending { color: orange; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }

        .action-btn {
            padding: 6px 12px;
            font-size: 13px;
            margin-right: 5px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            color: white;
        }
        .btn-approve { background-color: var(--success-color); }
        .btn-delete { background-color: var(--danger-color); }
        .btn-reset { background-color: var(--warning-color); color: #fff; }

    </style>
</head>
<body>

    <div id="auth-section" class="auth-container">
        
        <form id="login-form" class="auth-box" onsubmit="handleLogin(event)">
            <h2>員工登入</h2>
            <div class="input-group">
                <input type="text" id="login-user" name="username" placeholder="使用者名稱" autocomplete="username" required>
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" name="password" placeholder="密碼" autocomplete="current-password" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="keep-login"> 
                <label for="keep-login" style="cursor:pointer; font-size:14px; color:#333;">保持登入</label>
            </div>

            <button type="submit" class="btn btn-primary">登入</button>
            
            <button type="button" class="btn btn-warning" style="margin-top:15px; font-size:14px;" onclick="quickApprove()">管理員現場開通 (輸入8888)</button>

            <div class="switch-link" onclick="showRegister()">還沒有帳號？申請綁定</div>
            <div class="switch-link" onclick="showAdminAuth()">進入完整後台 (管理員專用)</div>
        </form>

        <div id="register-form" class="auth-box" style="display: none;">
            <h2>申請帳號綁定</h2>
            <div class="alert-box">
                注意：此系統為單機綁定。<br>
                申請後，請將此裝置拿給管理員輸入密碼開通，否則無法登入。
            </div>
            <input type="text" id="reg-user" placeholder="設定使用者名稱" autocomplete="username">
            <input type="password" id="reg-pass" placeholder="設定密碼" autocomplete="new-password">
            <button class="btn btn-secondary" onclick="handleRegister()">送出申請</button>
            <button class="btn btn-danger" onclick="clearPending()" style="margin-top:10px; font-size:14px;">清除舊申請 (名稱重複請點此)</button>
            <div class="switch-link" onclick="showLogin()">返回登入</div>
        </div>

        <div id="admin-auth-form" class="auth-box" style="display: none;">
            <h2>管理員後台驗證</h2>
            <input type="password" id="admin-pass-input" placeholder="請輸入管理員密碼">
            <button class="btn btn-danger" onclick="handleAdminLogin()">進入管理後台</button>
            <div class="switch-link" onclick="showLogin()">返回員工登入</div>
        </div>
    </div>

    <div id="dashboard-section" style="display: none; height: 100vh;">
        <div class="sidebar">
            <div class="sidebar-header">HomeGo Estate</div>
            <ul class="nav-links">
                <li><a href="#" onclick="loadPage(0, this)" class="active">員工管理</a></li>
                <li><a href="#" onclick="loadPage(1, this)">案件管理</a></li>
                <li><a href="#" onclick="loadPage(2, this)">案件流程</a></li>
                <li><a href="#" onclick="loadPage(3, this)">收據系統</a></li>
                <li><a href="#" onclick="loadPage(4, this)">報價系統</a></li>
                <li id="admin-link" style="display:none;"><a href="#" onclick="showAdminPanel(this)" style="background:#c0392b;">管理員後台</a></li>
            </ul>
            <div class="user-info">
                歡迎, <span id="display-username">User</span><br>
                <button class="btn btn-danger" style="padding:5px; margin-top:10px; font-size:12px;" onclick="logout()">登出</button>
            </div>
        </div>

        <div class="main-content">
            <iframe id="content-frame" src=""></iframe>
            
            <div id="admin-panel">
                <h2>本機帳號管理</h2>
                <div class="alert-box" style="border-color: #bee5eb; background-color: #d1ecf1; color: #0c5460;">
                    提示：此列表僅顯示曾經使用過「這台電腦/手機」註冊的員工。
                </div>
                <div class="admin-section">
                    <h3>👥 員工帳號列表</h3>
                    <table id="user-table">
                        <thead>
                            <tr>
                                <th>使用者名稱</th>
                                <th>狀態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "8888";
        const SITES = [
            "https://homegoestate.github.io/-Employee-management/",
            "https://homegoestate.github.io/case/",
            "https://homegoestate.github.io/case-procedure/",
            "https://homegoestate.github.io/receipts/",
            "https://homegoestate.github.io/quotation/"
        ];

        window.onload = function() {
            const savedUser = localStorage.getItem('hg_auto_login_user');
            if (savedUser) {
                let users = getUsers();
                let validUser = users.find(u => u.username === savedUser && u.approved);
                if (validUser) {
                    enterDashboard(savedUser, false);
                } else {
                    localStorage.removeItem('hg_auto_login_user');
                }
            }
        };

        function getUsers() {
            const users = localStorage.getItem('hg_users');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('hg_users', JSON.stringify(users));
        }

        // === 頁面切換 ===
        function showLogin() {
            document.getElementById('auth-section').style.display = 'flex';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('admin-auth-form').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'none';
        }
        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }
        function showAdminAuth() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('admin-auth-form').style.display = 'block';
        }

        // === 註冊功能 ===
        function handleRegister() {
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if(!user || !pass) { alert("請輸入完整資訊"); return; }

            let users = getUsers();
            if(users.find(u => u.username === user)) {
                alert("此名稱已存在此裝置中。若要重新申請，請點擊下方紅色按鈕「清除舊申請」。");
                return;
            }

            users.push({ username: user, password: pass, approved: false });
            saveUsers(users);
            alert("✅ 申請成功！\n\n請將此裝置交給管理員，在登入畫面點擊「管理員現場開通」，輸入 8888 即可啟用。");
            
            document.getElementById('reg-user').value = "";
            document.getElementById('reg-pass').value = "";
            showLogin();
        }

        // === 清除舊申請 (解決重複名稱問題) ===
        function clearPending() {
            const userToDelete = prompt("請輸入要清除的「使用者名稱」：");
            if(!userToDelete) return;

            let users = getUsers();
            const index = users.findIndex(u => u.username === userToDelete);

            if(index !== -1) {
                // 為了安全，如果該帳號已經核准，需要密碼才能刪，若未核准直接刪
                if(users[index].approved) {
                    alert("此帳號已核准，請從管理員後台刪除。");
                } else {
                    users.splice(index, 1);
                    saveUsers(users);
                    alert(`已清除申請紀錄：${userToDelete}，您可以重新註冊了。`);
                }
            } else {
                alert("找不到此使用者名稱。");
            }
        }

        // === 現場快速開通 (新功能) ===
        function quickApprove() {
            const pass = prompt("請管理員輸入密碼 (8888) 以開通此裝置上的待審帳號：");
            if (pass === ADMIN_PASS) {
                let users = getUsers();
                let approvedCount = 0;
                
                // 將所有未核准的變更為核准
                users.forEach(u => {
                    if(!u.approved) {
                        u.approved = true;
                        approvedCount++;
                    }
                });

                if(approvedCount > 0) {
                    saveUsers(users);
                    alert(`✅ 驗證成功！已開通 ${approvedCount} 個帳號。\n員工現在可以登入了。`);
                } else {
                    alert("目前此裝置沒有等待審核的帳號。");
                }
            } else if (pass !== null) {
                alert("密碼錯誤！");
            }
        }

        // === 登入功能 ===
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const keepLogin = document.getElementById('keep-login').checked;
            
            let users = getUsers();
            const targetUser = users.find(u => u.username === user && u.password === pass);

            if (targetUser) {
                if (targetUser.approved) {
                    if(keepLogin) localStorage.setItem('hg_auto_login_user', user);
                    enterDashboard(targetUser.username, false);
                } else {
                    alert("⚠️ 帳號尚未開通！\n請點擊下方的黃色按鈕「管理員現場開通」，並請管理員輸入密碼。");
                }
            } else {
                alert("帳號或密碼錯誤 (或此帳號不在這台裝置上)");
            }
        }

        function handleAdminLogin() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASS) {
                enterDashboard("Administrator", true);
            } else {
                alert("密碼錯誤");
            }
        }

        function enterDashboard(username, isAdmin) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'flex';
            document.getElementById('display-username').innerText = username;
            loadPage(0, document.querySelector('.nav-links li a'));

            if(isAdmin) {
                document.getElementById('admin-link').style.display = 'block';
                showAdminPanel(null);
            }
        }

        function loadPage(index, element) {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('content-frame').style.display = 'block';
            document.getElementById('content-frame').src = SITES[index];
            if(element) {
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                element.classList.add('active');
            }
        }

        function showAdminPanel(element) {
            document.getElementById('content-frame').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            if(element) {
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                element.classList.add('active');
            }
            renderUserTable();
        }

        function renderUserTable() {
            const users = getUsers();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            users.forEach((u, index) => {
                const tr = document.createElement('tr');
                const statusHtml = u.approved 
                    ? `<span class="status-approved">已核准</span>` 
                    : `<span class="status-pending">等待中</span>`;
                const approveBtn = u.approved
                    ? `<button class="action-btn btn-delete" onclick="toggleApprove(${index})">停用</button>`
                    : `<button class="action-btn btn-approve" onclick="toggleApprove(${index})">核准</button>`;
                tr.innerHTML = `
                    <td>${u.username}</td>
                    <td>${statusHtml}</td>
                    <td>
                        ${approveBtn}
                        <button class="action-btn btn-reset" onclick="resetPassword(${index})">改密碼</button>
                        <button class="action-btn btn-delete" onclick="deleteUser(${index})">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleApprove(index) {
            let users = getUsers();
            users[index].approved = !users[index].approved;
            saveUsers(users);
            renderUserTable();
        }

        function deleteUser(index) {
            if(confirm("確定要刪除嗎？")) {
                let users = getUsers();
                users.splice(index, 1);
                saveUsers(users);
                renderUserTable();
            }
        }

        function resetPassword(index) {
            let users = getUsers();
            let newPass = prompt(`重設 ${users[index].username} 的密碼：`);
            if(newPass) {
                users[index].password = newPass;
                saveUsers(users);
                alert("密碼已更新");
            }
        }

        function logout() {
            localStorage.removeItem('hg_auto_login_user');
            location.reload();
        }

        // 安全防護
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
    </script>
</body>
</html>
