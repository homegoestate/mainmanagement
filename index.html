<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeGo Estate - 雲端戰情中心</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === 科技感樣式設定 === */
        :root {
            --bg-main: #0f172a; --bg-secondary: #1e293b;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            --danger-color: #ef4444; --sidebar-width: 260px; --header-height: 64px;
            --glass-bg: rgba(30, 41, 59, 0.7); --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; user-select: none; }
        
        /* 基礎元件 */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: 700; color: white; transition: 0.3s; }
        .btn-primary { background: var(--accent-gradient); }
        .btn-secondary { background-color: var(--bg-secondary); border: var(--glass-border); color: var(--text-secondary); }
        .btn-danger { background-color: var(--danger-color); }
        .input-group { margin: 20px 0; text-align: left; }
        .input-box { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: var(--glass-border); border-radius: 8px; box-sizing: border-box; font-size: 16px; color: var(--text-primary); outline: none; }
        .checkbox-group { display: flex; align-items: center; margin: 20px 0; gap: 10px; color: var(--text-secondary); }
        .switch-link { margin-top: 25px; font-size: 14px; color: var(--text-secondary); cursor: pointer; }

        /* 登入區 */
        .auth-container { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); position: fixed; top: 0; left: 0; z-index: 9999; }
        .auth-box { background: var(--glass-bg); backdrop-filter: blur(20px); padding: 40px; border-radius: 16px; border: var(--glass-border); width: 90%; max-width: 420px; text-align: center; }
        .auth-box h2 { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
        .alert-box { background: rgba(6, 182, 212, 0.1); color: #06b6d4; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; border-left: 4px solid #06b6d4; text-align: left; }

        /* 儀表板 */
        #dashboard-section { display: none; height: 100vh; display: flex; flex-direction: column; }
        .top-header { height: var(--header-height); background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: var(--glass-border); display: flex; align-items: center; padding: 0 20px; position: relative; z-index: 2000; }
        .brand-logo { font-size: 20px; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-right: 30px; display: flex; align-items: center; gap: 10px; }
        .menu-toggle-btn { display: none; background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; margin-right: 20px; }

        /* 新聞跑馬燈 (修復樣式) */
        #news-ticker-bar { flex-grow: 1; overflow: hidden; white-space: nowrap; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #06b6d4; pointer-events: auto; }
        .news-label { font-weight: bold; margin-right: 15px; color: var(--text-secondary); flex-shrink: 0; }
        #news-content { display: inline-block; padding-left: 100%; cursor: pointer; }
        
        /* 新聞連結專用樣式 (確保可點擊) */
        .news-link {
            color: #06b6d4; text-decoration: none; margin-right: 40px; 
            display: inline-flex; align-items: center; gap: 5px; transition: color 0.2s;
            pointer-events: auto !important; /* 強制接收點擊 */
            cursor: pointer !important;
        }
        .news-link:hover { color: #fff; text-decoration: underline; text-shadow: 0 0 10px rgba(6, 182, 212, 0.8); }

        /* 動畫 */
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        
        .dashboard-body { display: flex; flex-grow: 1; overflow: hidden; position: relative; }
        .sidebar { width: var(--sidebar-width); background: var(--bg-secondary); border-right: var(--glass-border); display: flex; flex-direction: column; z-index: 1500; transition: transform 0.3s ease; }
        .nav-links { list-style: none; padding: 20px 10px; margin: 0; flex-grow: 1; overflow-y: auto; }
        .nav-links li a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-secondary); text-decoration: none; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; }
        .nav-links li a:hover, .nav-links li a.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; font-weight: 600; }
        .user-info { padding: 20px; background: rgba(0,0,0,0.2); border-top: var(--glass-border); text-align: left; font-size: 0.9em; color: var(--text-secondary); }
        .main-content { flex-grow: 1; background-color: var(--bg-main); position: relative; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; background: white; }

        @media (max-width: 768px) {
            .menu-toggle-btn { display: block; }
            .brand-logo span { display: none; }
            .sidebar { position: absolute; height: 100%; left: 0; top: 0; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1400; }
            .sidebar-overlay.active { display: block; }
        }

        #admin-panel { display: none; padding: 20px; background: var(--bg-main); height: 100%; overflow-y: auto; color: var(--text-primary); }
        .admin-section { border: var(--glass-border); padding: 20px; border-radius: 12px; margin-bottom: 20px; background: var(--bg-secondary); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 500px; }
        th, td { border: var(--glass-border); padding: 12px; text-align: left; }
        th { background-color: rgba(59, 130, 246, 0.2); color: var(--text-primary); }
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-main); z-index: 10000; display:flex; justify-content:center; align-items:center; color: var(--text-primary); font-weight:bold; }
    </style>
</head>
<body>

    <div id="loading-overlay" style="display:none;"><i class="fas fa-circle-notch fa-spin"></i> 載入中...</div>

    <div id="auth-section" class="auth-container">
        <div id="login-form" class="auth-box">
            <h2><i class="fas fa-shield-alt"></i> 宏國地政雲端中控</h2>
            <div class="alert-box"><i class="fas fa-wifi"></i> 系統安全連線中</div>
            <div class="input-group"><label>使用者帳號</label><input type="text" id="login-user" class="input-box" placeholder="輸入帳號" autocomplete="username"></div>
            <div class="input-group"><label>登入密碼</label><input type="password" id="login-pass" class="input-box" placeholder="輸入密碼" autocomplete="current-password"></div>
            <div class="checkbox-group"><input type="checkbox" id="keep-login"><label for="keep-login">保持登入</label></div>
            <button id="btnLogin" class="btn btn-primary">安全登入</button>
            <div class="switch-link" onclick="showRegister()">新進同仁註冊</div>
            <div class="switch-link" onclick="showAdminAuth()" style="color: var(--text-secondary); font-size: 12px;">管理員後台</div>
        </div>
        <div id="register-form" class="auth-box" style="display: none;">
            <h2>📱 裝置綁定</h2>
            <div class="alert-box">請輸入 6 位數開通碼</div>
            <div class="input-group"><label>帳號</label><input type="text" id="reg-user" class="input-box" placeholder="帳號" autocomplete="username"></div>
            <div class="input-group"><label>密碼</label><input type="password" id="reg-pass" class="input-box" placeholder="密碼" autocomplete="new-password"></div>
            <div class="input-group"><label style="color:var(--danger-color);">開通碼</label><input type="number" id="reg-code" class="input-box" placeholder="開通碼"></div>
            <button id="btnRegister" class="btn btn-primary">註冊</button>
            <div class="switch-link" onclick="showLogin()">返回</div>
        </div>
        <div id="admin-auth-form" class="auth-box" style="display: none;">
            <h2>管理員驗證</h2>
            <div class="input-group"><input type="password" id="admin-pass-input" class="input-box" placeholder="密碼"></div>
            <button id="btnAdminLogin" class="btn btn-danger">進入</button>
            <div class="switch-link" onclick="showLogin()">返回</div>
        </div>
    </div>

    <div id="dashboard-section">
        <header class="top-header">
            <button class="menu-toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="brand-logo"><i class="fas fa-building"></i> <span>HomeGo Estate</span></div>
            <div id="news-ticker-bar">
                <span class="news-label"><i class="fas fa-broadcast-tower"></i> 地產快訊</span>
                <div style="overflow: hidden; flex-grow: 1;">
                    <span id="news-content">連線中...</span>
                </div>
            </div>
        </header>

        <div class="dashboard-body">
            <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
            <nav class="sidebar" id="sidebar">
                <ul class="nav-links">
                    <li><a href="#" onclick="loadPage(0, this)" class="active"><i class="fas fa-users"></i> 員工管理</a></li>
                    <li><a href="#" onclick="loadPage(1, this)"><i class="fas fa-file-alt"></i> 案件管理</a></li>
                    <li><a href="#" onclick="loadPage(2, this)"><i class="fas fa-chart-line"></i> 土地效益評估</a></li>
                    <li><a href="#" onclick="loadPage(3, this)"><i class="fas fa-receipt"></i> 收據系統</a></li>
                    <li><a href="#" onclick="loadPage(4, this)"><i class="fas fa-calculator"></i> 報價系統</a></li>
                    <li><a href="#" onclick="loadPage(5, this)"><i class="fas fa-robot"></i> AI 問答助手</a></li>
                    <li><a href="#" onclick="loadPage(6, this)"><i class="fas fa-university"></i> 銀行優選</a></li>
                    <li id="admin-link" style="display:none; margin-top: 20px;"><a href="#" onclick="showAdminPanel(this)" style="background:rgba(239, 68, 68, 0.2); color:#ef4444;"><i class="fas fa-cogs"></i> 管理員後台</a></li>
                </ul>
                <div class="user-info">
                    <span id="display-username">User</span>
                    <button class="btn btn-secondary" style="padding:10px; margin-top:15px; background:transparent;" onclick="window.logout()">登出</button>
                </div>
            </nav>

            <main class="main-content">
                <iframe id="content-frame" src=""></iframe>
                <div id="admin-panel">
                    <h2 style="padding-top:20px; margin-bottom:30px;"><i class="fas fa-shield-alt"></i> 雲端管理員</h2>
                    <div class="admin-section" style="border-left: 4px solid var(--danger-color);"><h3>🚫 封鎖名單</h3><div id="banned-list-display" style="color:#ef4444; font-weight:bold;">無</div></div>
                    <div class="admin-section"><h3>🚀 開通碼</h3><div style="display:flex; gap:10px; margin-top:15px;"><input type="text" id="admin-generate-name" class="input-box" placeholder="帳號" style="flex:1;"><button class="btn btn-primary" style="width:auto; margin:0; padding: 12px 20px;" onclick="generateCode()">產生</button></div><div id="generated-code-area" style="display:none; margin-top:20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px;">開通碼：<span id="display-code" style="font-size: 24px; font-weight: bold; color: #06b6d4; letter-spacing: 3px; margin-left: 10px;"></span></div></div>
                    <div class="admin-section"><h3>👥 使用者列表</h3><div class="table-responsive"><table id="user-table"><thead><tr><th>使用者</th><th>裝置</th><th>數量</th><th>操作</th></tr></thead><tbody id="user-table-body"></tbody></table></div></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
        }
    </script>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
