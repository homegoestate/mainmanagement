<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeGo Estate - 內部管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --text-light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* 禁止選取文字 */
        }

        /* 登入與註冊容器 */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }

        .auth-box h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }

        .switch-link {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 儀表板樣式 */
        #dashboard-container {
            display: none; /* 預設隱藏 */
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            background-color: var(--secondary-color);
            font-weight: bold;
            font-size: 1.2em;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .nav-links li {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-links li a {
            display: block;
            padding: 15px 20px;
            color: var(--text-light);
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background-color: var(--accent-color);
        }

        .user-info {
            padding: 15px;
            background-color: var(--secondary-color);
            text-align: center;
            font-size: 0.9em;
        }

        .main-content {
            flex-grow: 1;
            background-color: white;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 管理員面板 */
        #admin-panel {
            display: none;
            padding: 20px;
            background: white;
            height: 100%;
            overflow-y: auto;
        }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: var(--primary-color); color: white; }

        .status-pending { color: orange; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }

    </style>
</head>
<body>

    <div id="auth-section" class="auth-container">
        
        <div id="login-form" class="auth-box">
            <h2>員工登入</h2>
            <input type="text" id="login-user" placeholder="使用者名稱">
            <input type="password" id="login-pass" placeholder="密碼">
            <button class="btn btn-primary" onclick="handleLogin()">登入</button>
            <div class="switch-link" onclick="showRegister()">還沒有帳號？申請綁定</div>
            <div class="switch-link" onclick="showAdminAuth()">管理員登入</div>
        </div>

        <div id="register-form" class="auth-box" style="display: none;">
            <h2>申請帳號綁定</h2>
            <p style="font-size:12px; color:red;">註冊後需等待管理員核准</p>
            <input type="text" id="reg-user" placeholder="設定使用者名稱">
            <input type="password" id="reg-pass" placeholder="設定密碼">
            <button class="btn btn-secondary" onclick="handleRegister()">送出申請</button>
            <div class="switch-link" onclick="showLogin()">返回登入</div>
        </div>

        <div id="admin-auth-form" class="auth-box" style="display: none;">
            <h2>管理員驗證</h2>
            <input type="password" id="admin-pass-input" placeholder="請輸入管理員密碼">
            <button class="btn btn-danger" onclick="handleAdminLogin()">進入管理後台</button>
            <div class="switch-link" onclick="showLogin()">返回員工登入</div>
        </div>
    </div>

    <div id="dashboard-section" style="display: none; height: 100vh;">
        <div class="sidebar">
            <div class="sidebar-header">HomeGo Estate</div>
            <ul class="nav-links">
                <li><a href="#" onclick="loadPage(0, this)" class="active">員工管理</a></li>
                <li><a href="#" onclick="loadPage(1, this)">案件管理</a></li>
                <li><a href="#" onclick="loadPage(2, this)">案件流程</a></li>
                <li><a href="#" onclick="loadPage(3, this)">收據系統</a></li>
                <li><a href="#" onclick="loadPage(4, this)">報價系統</a></li>
                <li id="admin-link" style="display:none;"><a href="#" onclick="showAdminPanel(this)" style="background:#c0392b;">管理員後台</a></li>
            </ul>
            <div class="user-info">
                歡迎, <span id="display-username">User</span><br>
                <button class="btn btn-danger" style="padding:5px; margin-top:10px; font-size:12px;" onclick="logout()">登出</button>
            </div>
        </div>

        <div class="main-content">
            <iframe id="content-frame" src=""></iframe>
            
            <div id="admin-panel">
                <h2>帳號核准管理</h2>
                <p>只有狀態為 "Approved" 的員工才能登入。</p>
                <table id="user-table">
                    <thead>
                        <tr>
                            <th>使用者名稱</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // === 系統配置 ===
        const ADMIN_PASS = "8888";
        const SITES = [
            "https://homegoestate.github.io/-Employee-management/",
            "https://homegoestate.github.io/case/",
            "https://homegoestate.github.io/case-procedure/",
            "https://homegoestate.github.io/receipts/",
            "https://homegoestate.github.io/quotation/"
        ];

        // === 資料庫模擬 (LocalStorage) ===
        function getUsers() {
            const users = localStorage.getItem('hg_users');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('hg_users', JSON.stringify(users));
        }

        // === 頁面切換邏輯 ===
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('admin-auth-form').style.display = 'none';
        }
        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }
        function showAdminAuth() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('admin-auth-form').style.display = 'block';
        }

        // === 註冊功能 ===
        function handleRegister() {
            const user = document.getElementById('reg-user').value;
            const pass = document.getElementById('reg-pass').value;

            if(!user || !pass) { alert("請輸入完整資訊"); return; }

            let users = getUsers();
            if(users.find(u => u.username === user)) {
                alert("此使用者名稱已被使用");
                return;
            }

            // 新用戶預設 approved: false
            users.push({ username: user, password: pass, approved: false });
            saveUsers(users);
            alert("申請已送出！請通知管理員核准後方可登入。");
            showLogin();
        }

        // === 登入功能 ===
        function handleLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            let users = getUsers();

            const targetUser = users.find(u => u.username === user && u.password === pass);

            if (targetUser) {
                if (targetUser.approved) {
                    enterDashboard(targetUser.username, false);
                } else {
                    alert("您的帳號尚未被核准，請稍候或聯繫管理員。");
                }
            } else {
                alert("帳號或密碼錯誤");
            }
        }

        // === 管理員登入 ===
        function handleAdminLogin() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASS) {
                enterDashboard("Administrator", true);
            } else {
                alert("管理員密碼錯誤");
            }
        }

        // === 進入系統 ===
        function enterDashboard(username, isAdmin) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'flex'; // Fix: reset to flex
            document.getElementById('display-username').innerText = username;
            
            // 預設載入第一個頁面
            loadPage(0, document.querySelector('.nav-links li a'));

            if(isAdmin) {
                document.getElementById('admin-link').style.display = 'block';
                showAdminPanel(null); // 管理員預設看後台
            }
        }

        // === 載入 iframe 頁面 ===
        function loadPage(index, element) {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('content-frame').style.display = 'block';
            document.getElementById('content-frame').src = SITES[index];
            
            // 更新 Active 狀態
            if(element) {
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                element.classList.add('active');
            }
        }

        // === 管理員面板邏輯 ===
        function showAdminPanel(element) {
            document.getElementById('content-frame').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            
            if(element) {
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                element.classList.add('active');
            }
            renderUserTable();
        }

        function renderUserTable() {
            const users = getUsers();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            users.forEach((u, index) => {
                const tr = document.createElement('tr');
                const statusClass = u.approved ? 'status-approved' : 'status-pending';
                const statusText = u.approved ? '已核准 (Approved)' : '等待中 (Pending)';
                const actionBtn = u.approved 
                    ? `<button class="btn btn-danger" style="width:auto; padding:5px 10px;" onclick="toggleApprove(${index})">停用</button>` 
                    : `<button class="btn btn-primary" style="width:auto; padding:5px 10px;" onclick="toggleApprove(${index})">核准</button>`;

                tr.innerHTML = `
                    <td>${u.username}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>${actionBtn} <button class="btn btn-secondary" style="width:auto; padding:5px 10px;" onclick="deleteUser(${index})">刪除</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleApprove(index) {
            let users = getUsers();
            users[index].approved = !users[index].approved;
            saveUsers(users);
            renderUserTable();
        }

        function deleteUser(index) {
            if(confirm("確定要刪除此使用者嗎？")) {
                let users = getUsers();
                users.splice(index, 1);
                saveUsers(users);
                renderUserTable();
            }
        }

        function logout() {
            location.reload();
        }

        // === 安全防護 (防竊取) ===
        // 禁止右鍵
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 禁止常見開發者工具快捷鍵
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; } // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
        }

    </script>
</body>
</html>
