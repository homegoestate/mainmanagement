<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>宏國地政｜易丞地政｜既有帳號檢查</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<style>:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#203346;background:#f2f5f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:670px;margin:30px auto;background:white;border:1px solid #d7e1eb;border-top:5px solid #c5a065;border-radius:18px;padding:28px}h1{color:#0f2e46;font-size:24px}h2{font-size:18px}p{line-height:1.8}.note{background:#fff7e7;padding:14px;border-radius:10px;font-size:14px}label{display:grid;gap:6px;margin:15px 0}input,button{font:inherit;min-height:44px;padding:11px;border-radius:8px;border:1px solid #b9c8d6}button{cursor:pointer;background:#0f2e46;color:#fff}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#eef4fa;color:#1c4262}#status{white-space:pre-line;line-height:1.9;overflow-wrap:anywhere;background:#f1f6fb;padding:16px;border-radius:10px;margin:18px 0}.small{font-size:12px;color:#617386}a{color:#175a8e}</style></head><body><main><h1>宏國地政｜易丞地政</h1><h2>既有 Firebase 帳號檢查</h2><p class="note">這頁只確認「帳號登入」及「Email 驗證」，不授予 ERP 或員工管理權限，不讀取員工、薪資、打卡或舊密碼資料。通過這頁不代表總管理／打卡已完成整合。</p>
<form id="check"><label>已建立的 Firebase 帳號 Email<input id="email" type="email" autocomplete="username" required></label><label>該帳號密碼<input id="password" type="password" autocomplete="current-password" required></label><button id="login" type="submit" disabled>檢查既有帳號</button></form><div id="status" role="status" aria-live="polite">載入 Firebase 官方驗證程式…</div><div class="actions"><button id="refresh" type="button" disabled>已完成信件驗證，重新確認</button><button id="verify" type="button" disabled>重寄驗證信</button><button id="reset" type="button" disabled>寄送重設密碼信</button><button id="signout" type="button" disabled>登出檢查頁</button><button id="copy" type="button">複製無個資檢查結果</button></div><p class="small">密碼只由 Firebase 官方 SDK 傳至 Google 驗證服務，不寫入資料庫、網址、瀏覽器永久儲存或診斷內容。本頁使用獨立且只存在記憶體的登入狀態；關閉後不保持登入。不要把密碼或驗證信中的連結貼到對話。</p><p><a href="./index.html">返回原總管理</a>　｜　<a href="./news.html">新聞新知中心</a></p></main><script type="module" src="./login-check.mjs"></script></body></html>
